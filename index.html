<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Manager – ORLEN Unipetrol</title>
    <meta name="theme-color" content="#f8f6f6" />
    <!-- Favicon: the red O of the brand's graphic symbol (manual 5.1). -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23d81e04' stroke-width='16'/%3E%3C/svg%3E" />
    <script>
      // Palette applied before first paint (no flash). Mirrors validPalette() / applyAppearance()
      // in src/lib/palettes.ts and src/store/prefsStore.ts: older palettes map to the ORLEN look.
      try {
        var p = JSON.parse(localStorage.getItem('pm-web:palette') || 'null')
        if (!p) p = JSON.parse(localStorage.getItem('pm-web:theme') || 'null')
        var dark = ['orlen-dark', 'nexus', 'nebula', 'emerald', 'sapphire', 'titanium', 'corp-dark', 'dark'].indexOf(p) >= 0
        document.documentElement.dataset.theme = dark ? 'orlen-dark' : 'orlen-light'
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
