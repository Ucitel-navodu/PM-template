<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Manager Web</title>
    <script>
      // Palette applied before first paint (no flash). Mirrors applyAppearance() in src/store/prefsStore.ts.
      try {
        var p = JSON.parse(localStorage.getItem('pm-web:palette') || 'null')
        if (!p) p = JSON.parse(localStorage.getItem('pm-web:theme') || 'null') === 'light' ? 'light' : 'nexus'
        document.documentElement.dataset.theme = p
        document.documentElement.classList.toggle('dark', p !== 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
